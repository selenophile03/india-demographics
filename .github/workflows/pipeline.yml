name: Deploy Demographic Data Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to click a button on GitHub to run it manually

permissions:
  contents: write # Grants the server rights to update and save the new chart files

jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Analysis
      run: python scripts/analyze.py

    - name: Generate Trends Visual Chart
      run: python scripts/visualize.py

    - name: Commit and Push Updated Charts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add statewise_imr_trends_1947_2026.png
        git diff-index --quiet HEAD || (git commit -m "Automated update: Refreshed analytical charts" && git push)

    - name: Upload Artifacts for Deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy-to-pages:
    needs: run-pipeline-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
