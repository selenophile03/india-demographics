name: Deploy Demographic Data Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches full history to ensure safe deployment branches push

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Analysis
      run: python scripts/analyze.py

    - name: Generate Trends Visual Chart
      run: python scripts/visualize.py

    - name: Commit and Force Sync Generated Charts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Track and forcibly add the newly written workspace file
        git add statewise_imr_trends_1947_2026.png
        
        # Check if changes exist, commit and push safely if they do
        if git diff --staged --quiet; then
          echo "No chart changes detected, moving to artifact delivery stage."
        else
          git commit -m "Automated update: Synchronized statewise analysis chart assets [skip ci]"
          git push origin main
        fi

    - name: Upload Artifacts for Deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy-to-pages:
    needs: run-pipeline-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
